# Oberfläche: dunkles Design als Standard. Hell lässt sich weiterhin im Menü (⋮ → Settings) wählen.
# Farben mit ausreichendem Kontrast (WCAG AA): Text auf Hintergrund > 12:1, weiße Schrift auf Akzent > 4,5:1.
[theme]
base = "dark"
primaryColor = "#2F6FDB"
backgroundColor = "#0F141C"
secondaryBackgroundColor = "#1A2230"
textColor = "#E6EAF0"

[client]
toolbarMode = "viewer"
